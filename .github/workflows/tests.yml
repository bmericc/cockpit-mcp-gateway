name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: public-gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes *.py
      - name: Tests
        run: python -m pytest -v
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp sample.env .env && docker compose config --quiet
      - name: Build image
        run: docker build public-gateway
