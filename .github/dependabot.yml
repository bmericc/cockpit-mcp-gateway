version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/public-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/public-gateway"
    schedule:
      interval: "weekly"
